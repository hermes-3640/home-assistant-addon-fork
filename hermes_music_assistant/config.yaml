name: Hermes Music Assistant
version: 0.0.0.dev20
slug: hermes_music_assistant
description:
  The Hermes Music Assistant server is a fork of the open-source Media library manager
  that connects to your streaming services and a wide range of connected speakers.
  Forked for Hermes integration with custom providers.
url: https://music-assistant.io
arch:
  - amd64
  - aarch64
homeassistant_api: true
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Hermes Music Assistant
panel_admin: false
uart: false
apparmor: true
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
stage: stable
image: ghcr.io/hermes-3640/music-assistant-server-fork
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
volume_mounts:
  - mount_folder: /data
    host_folder: /share/musicassistant
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
